<div class="info-card map-overlay" id="pair-card">
    <h4>Batch Label</h4>
    {% if error %}
    <p class="error-text">{{ error }}</p>
    {% endif %}
    <p>Generate a batch of stratified candidates for <strong>{{ dataset }}</strong>.</p>
    <p style="font-size: 0.85em; color: #888;">Samples from likely matches, borderline cases, and likely no-matches for diverse training signal.</p>
    <button class="btn-match"
            hx-post="/batch/generate"
            hx-target="#pair-content"
            hx-swap="innerHTML"
            hx-vals='{"dataset": "{{ dataset }}"}'>
        Generate Batch
    </button>
</div>

{% if request.headers.get('HX-Request') %}
<span id="pair-progress" hx-swap-oob="innerHTML">Ready</span>
{% endif %}
