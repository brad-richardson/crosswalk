<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Matcher - {% if mode == 'labeling' %}Label Creation{% elif mode == 'batch' %}Batch Label{% elif mode == 'review' %}Label Review{% elif mode == 'qa' %}Integration QA{% elif mode == 'browser' %}Browse{% elif mode == 'audit' %}Feature Audit{% else %}Label Creation{% endif %}</title>

    <!-- MapLibre GL CSS -->
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">

    <!-- App CSS -->
    <link rel="stylesheet" href="/static/css/app.css?v={{cache_bust}}">
</head>
<body>
    <!-- Fullscreen map container -->
    <div id="map"></div>

    <!-- Hamburger menu (top-right) -->
    <button class="menu-toggle map-overlay" id="menu-toggle" aria-label="Open menu">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <nav class="menu map-overlay hidden" id="menu">
        <h3>Mode</h3>
        <ul>
            <li><a href="/dashboard" class="{% if mode == 'dashboard' %}active{% endif %}">Dashboard</a></li>
            <li><a href="/labeling" class="{% if mode == 'labeling' %}active{% endif %}">Label Creation</a></li>
            <li><a href="/batch" class="{% if mode == 'batch' %}active{% endif %}">Batch Label</a></li>
            <li><a href="/review" class="{% if mode == 'review' %}active{% endif %}">Label Review</a></li>
            <li><a href="/qa" class="{% if mode == 'qa' %}active{% endif %}">Integration QA</a></li>
            <li><a href="/browser" class="{% if mode == 'browser' %}active{% endif %}">Browse</a></li>
            <li><a href="/audit" class="{% if mode == 'audit' %}active{% endif %}">Audit</a></li>
        </ul>

        <h3>Dataset</h3>
        <select id="dataset-picker" name="dataset" onchange="switchDataset(this.value)">
            <option value="">Select dataset...</option>
            {% for ds in datasets %}
            <option value="{{ ds }}" {% if ds == dataset %}selected{% endif %}>{% if request.state.dataset_label_counts.get(ds, 0) >= 200 %}&#x2705; {% endif %}{{ ds }}</option>
            {% endfor %}
        </select>

        {% if dataset %}
        <form method="post" action="/labeling/refresh" style="margin-top: 8px;">
            <input type="hidden" name="dataset" value="{{ dataset }}">
            <button type="submit" class="menu-btn" onclick="showLoading('Recomputing candidates\u2026')">
                Refresh candidates
            </button>
        </form>
        {% endif %}

        <hr>
        <label for="labeler-name">Labeler</label>
        <input id="labeler-name" type="text" value="{{ request.state.labeler_name }}"
               hx-post="/settings/labeler"
               hx-trigger="change"
               hx-swap="none"
               name="name">
    </nav>

    <!-- Loading overlay (covers entire screen during dataset loads) -->
    <div class="loading-overlay hidden" id="loading-overlay">
        <div class="loading-card">
            <span class="spinner"></span>
            <span id="loading-text">Loading...</span>
        </div>
    </div>

    <!-- Overlay content block for HTMX swaps -->
    <div id="overlay-content">
        {% block overlay %}{% endblock %}
    </div>

    <!-- Progress indicator -->
    <div class="progress-indicator map-overlay hidden" id="progress">
        <span class="spinner"></span>
        <span id="progress-text">Loading...</span>
    </div>

    <!-- MapLibre GL JS -->
    <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@2.0/dist/htmx.min.js"
            crossorigin="anonymous"></script>

    <!-- App JS -->
    <script src="/static/js/map.js?v={{cache_bust}}"></script>

    <!-- Menu toggle and dataset switcher -->
    <script>
        document.getElementById('menu-toggle').addEventListener('click', function() {
            document.getElementById('menu').classList.toggle('hidden');
        });

        function showLoading(message) {
            var overlay = document.getElementById('loading-overlay');
            if (overlay) {
                overlay.classList.remove('hidden');
                document.getElementById('loading-text').textContent = message || 'Loading\u2026';
            }
        }

        function switchDataset(datasetId) {
            // Guard: don't reload if we're already on this dataset
            var currentDataset = new URLSearchParams(window.location.search).get('dataset') || '';
            if ((datasetId || '') === (currentDataset || '')) return;

            showLoading('Loading dataset\u2026');

            // Disable picker to prevent double-switches
            var picker = document.getElementById('dataset-picker');
            if (picker) picker.disabled = true;

            var path = window.location.pathname;
            if (!path || path === '/') path = '/labeling';
            if (datasetId) {
                window.location.href = path + '?dataset=' + encodeURIComponent(datasetId);
            } else {
                window.location.href = path;
            }
        }
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
