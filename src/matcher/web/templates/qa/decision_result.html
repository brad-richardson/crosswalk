{% if success %}
<div class="info-card map-overlay" id="edge-card" style="border-left: 4px solid #4caf50;">
    <p style="color: #4caf50; font-weight: 600;">{{ message }}</p>
    <p style="font-size: 0.8rem; color: #999; margin-top: 4px;">Click another edge to continue reviewing.</p>
</div>
{% else %}
<div class="info-card map-overlay" id="edge-card" style="border-left: 4px solid #f44336;">
    <p style="color: #f44336; font-weight: 600;">{{ message }}</p>
</div>
{% endif %}
