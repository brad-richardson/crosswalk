    # footways/pedestrian areas.  strassenklasse2 overrides (FUWE→footway,
    # PLAT→pedestrian, FUBR→footway, PSTR→path, KGA/PARK→service) are
    # applied by `matcher data reclassify de_berlin_roads` after fetch.
    V: service
