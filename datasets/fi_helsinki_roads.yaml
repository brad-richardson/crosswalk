name: fi_helsinki_roads
display_name: Digiroad Finland (Helsinki + Southern Uusimaa)
type: road
description: Road network from Finnish national Digiroad database. Covers Helsinki
  metro area plus rural southern Uusimaa north to Hyvinkää/Riihimäki for sparse rural
  road coverage.
source:
  type: ogc_features
  url: https://avoinapi.vaylapilvi.fi/vaylatiedot/digiroad/ogc/features/v1/collections/dr_tielinkki_toim_lk/items
  portal_url: https://vayla.fi/en/transport-network/data/digiroad
fetch:
  id_prefix: hel_road
  id_column: link_id
  name_column: tienimi_su
  class_column: toiminn_lk
  class_mapping:
    1: motorway
    2: trunk
    3: primary
    4: secondary
    5: tertiary
    6: residential
    7: residential
    8: service
    9: service
  # Digiroad SILTA_ALIK is a signed, segment-wide physical level: positive
  # values are bridge levels; -1/-2/-3 are underpasses/underground levels;
  # -11 is an explicit tunnel.
  level_column: silta_alik
  bridge_column: silta_alik
  bridge_values: [1, 2, 3, 4, 5]
  tunnel_column: silta_alik
  tunnel_values: [-11]
  bbox:
  - 24.4
  - 60.0
  - 25.6
  - 60.8
  crs: EPSG:4326
