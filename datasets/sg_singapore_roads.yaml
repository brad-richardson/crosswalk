name: sg_singapore_roads
display_name: LTA Singapore Roads
type: road
description: Road section lines from Singapore LTA DataMall
source:
  type: download
  url: https://datamall.lta.gov.sg/content/dam/datamall/datasets/Geospatial/RoadSectionLine.zip
  portal_url: https://datamall.lta.gov.sg/content/datamall/en/static-data.html
  file_format: shp
  api_key_env_var: LTA_API_KEY
  api_key_header: AccountKey
fetch:
  id_prefix: sg_road
  # LTA ships RD_CD (road code) completely empty (verified again on the Mar 2026
  # release: 100% null), which collapsed every id to `sg_road_None_{h3}` and
  # dropped ~95% of segments as same-cell "duplicates" at fetch time. No other
  # column is a unique id (RD_CD_DESC is the road name, ~3.8k unique across
  # ~15k segments). Use the established synthetic geometry-hash id instead
  # (md5(WKT@7dp)[:12], same pattern as jp_tokyo_emergency_roads and
  # tn_tunis_ml_roads): stable across releases while geometry is unchanged;
  # geometry edits read as id churn, which the stored-geometry fallback
  # (PR #273) already handles. Revisit if LTA restores RD_CD.
  id_column: _geom_hash
  name_column: RD_CD_DESC
  class_column: RD_CATG__1
  class_mapping:
    Category 1: motorway
    Category 2: primary
    Category 3: secondary
    Category 4: tertiary
    Category 5: residential
    No Category: unclassified
  bbox:
  - 103.6
  - 1.2
  - 104.05
  - 1.5
  crs: EPSG:4326
