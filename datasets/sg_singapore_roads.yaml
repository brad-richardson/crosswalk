name: sg_singapore_roads
display_name: LTA Singapore Roads
type: road
description: Road section lines from Singapore LTA DataMall
source:
  type: download
  url: https://datamall.lta.gov.sg/content/dam/datamall/datasets/Geospatial/RoadSectionLine.zip
  file_format: shp
  api_key_env_var: LTA_API_KEY
  api_key_header: AccountKey
fetch:
  id_prefix: sg_road
  id_column: FID
  name_column: RD_CD_DESC
  class_column: RD_CATG__1
  class_mapping:
    Category 1: motorway
    Category 2: primary
    Category 3: secondary
    Category 4: tertiary
    Category 5: residential
    No Category: unclassified
  bbox:
  - 103.6
  - 1.2
  - 104.05
  - 1.5
  crs: EPSG:4326
classification:
  source_classification:
    column: RD_CATG__1
