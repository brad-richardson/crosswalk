# Publication license registry for the R2 bridge tables (Milestone M5).
#
# The publisher (`matcher factory publish`) reads this file to decide which
# datasets may be published. It NEVER guesses a license:
#
#   status = "approved"        -> dataset is published; requires `license` +
#                                 `attribution`.
#   status = "pending_review"  -> dataset is EXCLUDED (excluded-pending-review)
#                                 until a human verifies the source terms and
#                                 flips it to "approved".
#   (no entry)                 -> treated as pending_review (excluded).
#
# Published bridge tables are derived works of BOTH the local source dataset
# and Overture; every published artifact carries the [overture] attribution
# below plus the per-dataset attribution.

[overture]
name = "Overture Maps transportation theme"
license = "ODbL-1.0"
attribution = "Contains data from the Overture Maps Foundation (overturemaps.org). Overture transportation is derived from OpenStreetMap; © OpenStreetMap contributors, available under the Open Database License (ODbL) 1.0."
url = "https://overturemaps.org/"
note = "Confirm the ODbL/attribution requirement against the specific Overture release notes at publish time."

