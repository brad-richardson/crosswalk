name: ca_toronto_roads
display_name: Toronto Road Centreline
type: road
description: City of Toronto road network from municipal GIS
source:
  type: arcgis
  url: https://gis.toronto.ca/arcgis/rest/services/cot_geospatial/FeatureServer/2
  portal_url: https://open.toronto.ca/dataset/toronto-centreline-tcl/
fetch:
  id_prefix: ca_toronto
  id_column: OBJECTID
  name_column: LINEAR_NAME_FULL
  class_column: FEATURE_CODE_DESC
  class_mapping:
    Expressway: motorway
    Expressway Ramp: motorway_link
    Major Arterial: primary
    Major Arterial Ramp: primary_link
    Minor Arterial: secondary
    Minor Arterial Ramp: secondary_link
    Collector: tertiary
    Collector Ramp: tertiary_link
    Local: residential
    Laneway: service
    Other: unclassified
    Pending: unclassified
    Trail: path
    Walkway: footway
    Access Road: service
    Busway: service
    Other Ramp: unclassified
  exclude:
    FEATURE_CODE_DESC:
    - River
    - Hydro Line
    - Major Railway
    - Major Shoreline
    - Creek/Tributary
    - Minor Railway
    - Geostatistical line
    - Ferry Route
    - Minor Shoreline (Land locked)
  bbox:
  - -79.65
  - 43.58
  - -79.1
  - 43.86
  crs: EPSG:4326
