name: nl_amsterdam_roads
display_name: PDOK NWB Wegen
type: road
description: Road segments from Dutch National Road Database (NWB) - filtered to Amsterdam
source:
  type: download
  url: https://service.pdok.nl/rws/nationaal-wegenbestand-wegen/atom/downloads/nwb_wegen.gpkg
  file_format: gpkg
  cache_download: true
fetch:
  id_prefix: ams_road
  id_column: wvk_id
  name_column: stt_naam
  # bst_code = road type (fietspad, voetpad, rijbaan etc.)
  # Previous: wegbehsrt = road administrator, not road class
  class_column: bst_code
  class_mapping:
    FP: cycleway
    VP: footway
    BUS: service
    ERF: living_street
    PP: service
    VZ: service
    PST: service
    AFR: trunk
    OPR: trunk
    PAR: service
    NRB: residential
    HR: primary
    # RB = rijbaan (carriageway) — ideally falls back to frc column for
    # hierarchy, but simple mapping defaults to residential (most common).
    # Run `matcher data reclassify nl_amsterdam_roads` for frc-based fallback.
    RB: residential
  level_column: rel_hoogte
  bbox:
  - 4.75
  - 52.3
  - 5.0
  - 52.45
  crs: EPSG:4326
