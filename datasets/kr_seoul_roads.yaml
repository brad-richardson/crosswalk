name: kr_seoul_roads
display_name: Seoul Road Network
type: road
description: Korean road network with Hangul street names from Korea Public Data Portal
notes: |
  Option 1: V-World WFS (requires free API key from vworld.kr)
  Option 2: Direct download from data.go.kr (may require free registration)
  Source data uses EPSG:5179 (UTM-K) and EUC-KR encoding.
  Preprocessing required: convert CRS to WGS84 and encoding to UTF-8.
source:
  type: manual
  portal_url: https://www.data.go.kr/data/15146878/fileData.do
fetch:
  id_prefix: kr_seoul
  name_column: RN
  class_column: ROA_CLS_SE
  bbox:
  - 126.75
  - 37.40
  - 127.20
  - 37.70
  crs: EPSG:4326
