name: kr_seoul_roads
display_name: Seoul Road Network
type: road
description: Korean road network with Hangul street names from Korea Public Data Portal
notes: |
  Requires manual download from data.go.kr (free registration required).
  Source data uses EPSG:5179 (UTM-K) and EUC-KR encoding.
  After download, use fetch_download() with encoding and source_crs options.
source:
  type: manual
  portal_url: https://www.data.go.kr/data/15146878/fileData.do
fetch:
  id_prefix: kr_seoul
  name_column: RN
  class_column: ROA_CLS_SE
  bbox:
  - 126.75
  - 37.40
  - 127.20
  - 37.70
  crs: EPSG:4326
  source_crs: EPSG:5179
  encoding: EUC-KR
