name: CI

on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Create virtual environment
        run: uv venv
      - run: uv pip install ruff --python .venv/bin/python
      - run: uv run ruff format --check .
      - run: uv run ruff check .

  mbench:
    # mbench is a standalone package with its own env; the crosswalk `test` job
    # only runs `pytest tests/`, so mbench's tests (incl. the stitch-gate
    # machinery regression, test_gate.py) need their own job. Runs on committed
    # fixtures only — no data/raw or data/output required.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Run mbench tests
        working-directory: mbench
        run: >
          uv run --with pandas --with pyarrow --with typer --with rich
          --with loguru --with geopandas --with shapely --with osmium --with pytest
          pytest -q

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Create virtual environment
        run: uv venv
      - name: Install dependencies
        run: uv pip install -e ."[dev,ml,web]" --python .venv/bin/python
      - name: Train model
        run: uv run crosswalk train
      - name: Run tests
        run: uv run pytest tests/ -v --cov=crosswalk --cov-report=xml
      - name: Upload coverage (optional)
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
        continue-on-error: true

  publish:
    # PyPI Trusted Publishing (OIDC): the PyPI project `crosswalk-py` trusts this
    # repo's ci.yml workflow — no API token stored anywhere. Releases are cut by
    # pushing a `v*` tag matching pyproject.toml's version; nothing publishes on
    # ordinary branch pushes or PRs. Plain checkout suffices: the bundled model
    # artifacts are committed in-repo (not LFS; only labels/ parquets are), so
    # the wheel build is hermetic without an LFS fetch.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, mbench, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Check tag matches package versions
        run: |
          pkg_version=$(uv run --no-project --python 3.11 python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          init_version=$(uv run --no-project --python 3.11 python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/crosswalk/__init__.py').read()).group(1))")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ] || [ "$init_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject ($pkg_version) and/or __init__ ($init_version)" >&2
            exit 1
          fi
      - name: Build sdist and wheel
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1