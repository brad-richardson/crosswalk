name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Create virtual environment
        run: uv venv
      - run: uv pip install ruff --python .venv/bin/python
      - run: uv run ruff format --check .
      - run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Create virtual environment
        run: uv venv
      - name: Install dependencies
        run: uv pip install -e ".[dev,ml,web]" --python .venv/bin/python
      - name: Train model
        run: uv run matcher train
      - name: Run tests
        run: uv run pytest tests/ -v --cov=matcher --cov-report=xml
      - name: Upload coverage (optional)
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
        continue-on-error: true
