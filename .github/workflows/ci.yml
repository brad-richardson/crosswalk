name: CI

on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Lint only needs repository text; leave LFS objects as pointers to avoid
      # downloading the training corpus on every fresh runner.
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Create virtual environment
        run: uv venv
      # Keep this in sync with uv.lock. Invoke Ruff directly so this lint-only
      # job does not resolve and install the project's runtime dependencies.
      - run: uv pip install ruff==0.14.13 --python .venv/bin/python
      - run: .venv/bin/ruff format --check .
      - run: .venv/bin/ruff check .

  mbench:
    # mbench is a standalone package with its own env; the crosswalk `test` job
    # only runs `pytest tests/`, so mbench's tests (incl. the stitch-gate
    # machinery regression, test_gate.py) need their own job. Runs on committed
    # fixtures only — no data/raw or data/output required.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Run mbench tests
        working-directory: mbench
        run: >
          uv run --with pandas --with pyarrow --with typer --with rich
          --with loguru --with geopandas --with shapely --with osmium --with pytest
          pytest -q

  test:
    # x86_64 is the REQUIRED leg; arm64 is informational (see the matrix note in
    # the `spark` job below for why both exist and which one to act on).
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Check uv.lock is up to date with pyproject.toml
        run: uv lock --check
      - name: Create virtual environment
        run: uv venv
      - name: Install dependencies
        run: uv pip install -e ."[dev,ml,web]" --python .venv/bin/python
      - name: Train model
        run: uv run crosswalk train
      - name: Run tests
        run: uv run pytest tests/ -v --cov=crosswalk --cov-report=xml
      - name: Run performance tests (serial)
        # tests/performance asserts wall-clock budgets, so it self-skips on xdist
        # workers (tests/performance/conftest.py) and is run here on its own with
        # -n0. ~10s for all 42. Under the parallel run these measured whatever
        # else was co-scheduled and flaked accordingly.
        run: uv run pytest tests/performance -v -n0 --cov=crosswalk --cov-append --cov-report=xml
      - name: Upload coverage (optional)
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
        continue-on-error: true

  spark:
    # Toy E2E smoke test that the Spark + Sedona stack loads and runs a minimal
    # geospatial job (Sedona spatial join) and scores the bundled Spark-portable
    # booster inside a SparkSession. Separate job because it needs a JDK and pulls
    # the Sedona jars from Maven Central — heavier than the plain `test` job, which
    # skips these (marker `spark`, guarded to SKIP when the extra/JDK is absent).
    #
    # ARCH MATRIX. x86_64 is the leg to act on; arm64 is a divergence detector.
    #
    # Why both, when nothing here ships a compiled artifact: the numeric gates
    # only ever run on CI. tests/regression/test_loo_cv.py and
    # test_training.py are `skipif GITHUB_ACTIONS != "true"`, and the `test` job
    # trains its own model to evaluate them. So the runner architecture IS the
    # sole environment those floors are measured in, and `other` currently clears
    # its floor by +0.0011 (0.8891 vs 0.88). XGBoost `hist` chooses split points
    # from histogram bins; SIMD width, FMA contraction and libm differences
    # across x86/aarch64 can move macro-F1 by more than that margin.
    #
    # Running ARM-only would silently re-baseline the only place cross-dataset
    # generalization is checked. Running x86-only leaves aarch64 wheel and
    # numeric behaviour untested for anyone installing the published wheel there.
    # So: both, x86 authoritative.
    #
    # `fail-fast: false` is deliberate -- when they diverge you want to see WHICH
    # arch diverged, not have the first failure cancel the other. There is no
    # `continue-on-error` on the arm leg either: a red arm check is the signal
    # this matrix exists to produce, and hiding it would defeat the purpose.
    # `main` has no branch protection today, so neither leg blocks a merge. If
    # protection is added later, require only `test (ubuntu-latest)` and
    # `spark (ubuntu-latest)`.
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      # These tests use synthetic data and the bundled model, so materializing
      # the LFS-backed training corpus would only consume bandwidth.
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Create virtual environment
        run: uv venv
      - name: Install dependencies (with spark extra)
        run: uv pip install -e ."[dev,ml,web,spark]" --python .venv/bin/python
      - name: Restore Sedona/Ivy jar cache
        id: ivy-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.ivy2
          key: ivy2-${{ matrix.runner }}-sedona-1.6.1-spark-3.5
      - name: Run Spark/Sedona E2E tests
        # -n0 disables xdist so a single Spark session serves both tests.
        run: uv run pytest -m spark -n0 -v
      - name: Save Sedona/Ivy jar cache
        # Split restore/save (rather than the combined actions/cache@v4 action)
        # and gate the save on a green run: the combined action's post-step
        # saves unconditionally, so an interrupted/failed Maven resolve would
        # cache a partial or corrupt ~/.ivy2 under this exact static key. With
        # no restore-keys fallback, every later run then restores that poison
        # and red-X's until someone manually bumps the key (#363). Only
        # writing the cache after success keeps the key self-healing.
        if: success() && steps.ivy-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.ivy2
          key: ivy2-${{ matrix.runner }}-sedona-1.6.1-spark-3.5

  publish:
    # PyPI Trusted Publishing (OIDC): the PyPI project `crosswalk-py` trusts this
    # repo's ci.yml workflow — no API token stored anywhere. Releases are cut by
    # pushing a `v*` tag matching pyproject.toml's version; nothing publishes on
    # ordinary branch pushes or PRs. Plain checkout suffices: the bundled model
    # artifacts are committed in-repo (not LFS; only labels/ parquets are), so
    # the wheel build is hermetic without an LFS fetch.
    if: startsWith(github.ref, 'refs/tags/v')
    # NOTE: `needs: test` waits for EVERY matrix leg, so a red arm64 leg holds a
    # tagged release even though arm64 is informational for PRs. That is
    # deliberate and is the one place the arm leg is not merely advisory: the
    # wheel ships matcher_model_combined.joblib and the Spark booster, so if the
    # two architectures disagree about whether that model clears its LOO floors,
    # the right move is to stop and look rather than publish. Split arm64 into a
    # standalone job if you ever want releases to ignore it.
    needs: [lint, mbench, test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
      - name: Set up Python 3.11
        run: uv python install 3.11
      - name: Check tag matches package versions
        run: |
          pkg_version=$(uv run --no-project --python 3.11 python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          init_version=$(uv run --no-project --python 3.11 python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('src/crosswalk/__init__.py').read()).group(1))")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$pkg_version" != "$tag_version" ] || [ "$init_version" != "$tag_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject ($pkg_version) and/or __init__ ($init_version)" >&2
            exit 1
          fi
      - name: Build sdist and wheel
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
