# Example: Match Despite Name Mismatch
#
# Geometries align perfectly but names differ significantly.
# This can happen when one dataset uses a historical name or alternate name.
#
# Label: match
# Reasoning: Perfect geometric alignment overrides name difference

candidate:
  ref_id: "example_ref_002"
  target_id: "example_target_002"
  dataset: "boston_streets"
  batch: "example_batch"

names:
  reference: "Route 9"
  target: "Brookline Avenue"

classes:
  reference: "primary"
  target: "State Route"

ml_prediction:
  decision: "review"
  confidence: 0.65

geometry:
  ref_length_m: 312.7
  target_length_m: 308.4
  bbox: [-71.1034, 42.3321, -71.0989, 42.3345]

features:
  geometric:
    hausdorff_distance: 4.1
    mean_hausdorff_distance: 2.2
    buffer_iou: 0.91
    overlap_ratio: 0.96
    heading_delta: 2.3
    length_ratio: 0.99
    centroid_distance: 3.4
  semantic:
    name_levenshtein: 0.18
    name_jaro_winkler: 0.42
    name_token_sort: 0.0
    class_similarity: 0.8
  topological:
    degree_match_score: 0.88
    dead_end_match: false
    intersection_match: true

images:
  satellite: "satellite.png"
  geometry: "geometry.png"

# --- Expected Label ---
expected_label: "match"
expected_confidence: 0.85
expected_reasoning: "Excellent geometric alignment (buffer_iou 0.91, overlap 0.96). Different names but same physical road - Route 9 is the state designation, Brookline Avenue is the local name."
