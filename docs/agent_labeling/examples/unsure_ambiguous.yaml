# Example: Unsure - Ambiguous Case
#
# This case is genuinely ambiguous. The segments partially overlap but
# the geometry is unclear enough that reasonable labelers would disagree.
#
# Label: unsure
# Reasoning: Partial overlap, unclear if same road or adjacent infrastructure

candidate:
  ref_id: "example_ref_005"
  target_id: "example_target_005"
  dataset: "boston_streets"
  batch: "example_batch"

names:
  reference: null
  target: "Access Road"

classes:
  reference: "service"
  target: "Private Way"

ml_prediction:
  decision: "review"
  confidence: 0.52

geometry:
  ref_length_m: 45.2
  target_length_m: 72.8
  bbox: [-71.0756, 42.3445, -71.0742, 42.3458]

features:
  geometric:
    hausdorff_distance: 12.4
    mean_hausdorff_distance: 8.7
    buffer_iou: 0.51
    overlap_ratio: 0.58
    heading_delta: 15.3
    length_ratio: 0.62
    centroid_distance: 9.8
  semantic:
    name_levenshtein: 0.0
    name_jaro_winkler: 0.0
    name_token_sort: 0.0
    class_similarity: 0.4
  topological:
    degree_match_score: 0.35
    dead_end_match: true
    intersection_match: false

images:
  satellite: "satellite.png"
  geometry: "geometry.png"

# --- Expected Label ---
expected_label: "unsure"
expected_confidence: 0.50
expected_reasoning: "Reference is unnamed service road, target is 'Access Road'. Moderate overlap (51% IoU) but significant length difference (45m vs 73m) and 15-degree heading difference. Could be same road with different digitization, or adjacent service/access roads. Flag for human review."
