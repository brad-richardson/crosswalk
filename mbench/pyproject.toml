[project]
name = "mbench"
version = "0.1.0"
description = "Conflation benchmarking harness - compare road matching tools against ground truth"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Brad Richardson" }]

dependencies = [
    "pandas>=2.0",
    "pyarrow>=17.0",
    "typer>=0.12",
    "rich>=13.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
hootenanny = ["geopandas>=1.0", "shapely>=2.0"]
# Valhalla Meili map-matching baseline. Needs geopandas/shapely for geometry,
# pyosmium (PyPI package name: "osmium") to write the Overture->OSM-PBF graph,
# and pyvalhalla (native-ARM Valhalla binaries + Actor binding) for the in-process
# tile build + trace_attributes matching. pyvalhalla requires Python >= 3.12.
meili = ["geopandas>=1.0", "shapely>=2.0", "osmium>=3.6", "pyvalhalla>=3.7; python_version>='3.12'"]
# GraphHopper map-matching baseline. Shares the Overture->OSM-PBF conversion with
# Meili (geopandas/shapely/osmium), but the engine is a JVM library run at match
# time via `jbang` (which resolves the pinned graphhopper-map-matching jar from
# Maven Central and manages the JDK) — so there is no Python engine dep and it
# works on Python 3.11. Install jbang separately: `brew install jbang`.
graphhopper = ["geopandas>=1.0", "shapely>=2.0", "osmium>=3.6"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
mbench = "mbench.cli:app"
# Deprecated alias: warns and forwards to `mbench`. Remove in a future release.
cbench = "mbench.cli:cbench_deprecated"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mbench"]
# Ship the GraphHopper jbang runner (a .java data file) inside the package so the
# adapter can locate it at Path(__file__).with_name("GraphHopperRunner.java").
artifacts = ["*.java"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "E402", "B905", "SIM102", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
