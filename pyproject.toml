[project]
# PyPI distribution name (import package stays `matcher`, console script stays `matcher`).
# `matcher` itself is taken on PyPI; `road-matcher` was verified available (2026-07).
name = "road-matcher"
version = "0.2.0"
description = "Road network conflation pipeline - link local roads to Overture GERS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Brad Richardson" }]
keywords = ["overture-maps", "gers", "conflation", "road-network", "gis", "map-matching"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]

# Core = everything `matcher stitch` / `matcher fetch-overture` need, including the
# bundled pretrained model's runtime (xgboost + scikit-learn). Heavier maintainer
# tooling lives in extras: hyperparameter tuning (optuna) in dev, imagery rendering
# (pillow/mercantile) in web/dev.
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    "overturemaps>=0.8",
    "osmium>=4.0",
    "requests>=2.31",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "rapidfuzz>=3.5",
    "jellyfish>=1.0",
    "pyyaml>=6.0",
    "h3>=4.0",
    "typer>=0.12",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "rich>=13.0",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "numba>=0.59",
    "xgboost>=3.1.3",
    "networkx>=3.2",  # optimizer M:N chain grouping (matching/optimizer.py)
]

[project.optional-dependencies]
ml = [
    # xgboost is a core dependency (the shipped model needs it); this extra now
    # carries only the optional polygon-to-centerline conversion helper.
    "pygeoops>=0.4",
]
os = [
    "osdatahub>=1.0.0",
]
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "mapbox-vector-tile>=2.1",
    "pillow>=10.0",  # tile rendering (web/routes/tiles.py)
    "mercantile>=1.2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.5",
    "ruff>=0.5",
    "ipykernel>=6.27",
    "httpx>=0.27",  # Required for FastAPI TestClient
    "matplotlib>=3.8",  # For scripts/render_review_diffs.py review-diff PNGs
    "optuna>=4.7.0",  # scripts/tune_model.py hyperparameter search
    "pillow>=10.0",  # agent_labeling imagery (agent batch workflows)
    "mercantile>=1.2",
]

[project.urls]
Repository = "https://github.com/brad-richardson/matcher"

[project.scripts]
matcher = "matcher.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Keep the sdist to the installable package — without this, hatchling drags the
# whole repo (labels/, research/, cbench/, ~11 MB) into the tarball.
[tool.hatch.build.targets.sdist]
include = ["src", "README.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/matcher"]
# Ship the pretrained model in the wheel so `pip install road-matcher` can stitch
# with zero training (lockstep with FEATURE_VERSION enforced by
# tests/unit/test_shipped_model.py).
artifacts = ["src/matcher/_model/*.joblib"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "E402", "B905", "SIM102", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-n auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
