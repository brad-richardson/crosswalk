[project]
name = "matcher"
version = "0.1.0"
description = "Road network conflation pipeline - link local roads to Overture GERS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Brad Richardson" }]

dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "networkx>=3.2",
    "pyarrow>=17.0",
    "duckdb>=1.1",
    "overturemaps>=0.8",
    "osmium>=4.0",
    "requests>=2.31",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "rapidfuzz>=3.5",
    "jellyfish>=1.0",
    "pyyaml>=6.0",
    "h3>=3.7",
    "typer>=0.12",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "rich>=13.0",
    "loguru>=0.7",
    "python-dotenv>=1.0",
    "numba>=0.59",
    "pillow>=10.0",
    "mercantile>=1.2",
    "xgboost>=3.1.3",
]

[project.optional-dependencies]
spark = [
    "pyspark>=3.5",
    "apache-sedona>=1.5",
]
ml = [
    "xgboost>=2.0",
    "lightgbm>=4.2",
]
label = [
    "streamlit>=1.28",
    "streamlit-folium>=0.15",
    "folium>=0.15",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "ipykernel>=6.27",
]

[project.scripts]
matcher = "matcher.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matcher"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "E402", "B905", "SIM102", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
