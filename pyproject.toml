[project]
name = "matcher"
version = "0.1.0"
description = "Road network conflation pipeline - link local roads to Overture GERS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Brad Richardson" }]

dependencies = [
    "geopandas>=0.14",
    "shapely>=2.0",
    "pyproj>=3.6",
    "networkx>=3.2",
    "pyarrow>=14.0",
    "duckdb>=1.0",
    "pyrosm>=0.6",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "rapidfuzz>=3.5",
    "h3>=3.7",
    "typer>=0.9",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "rich>=13.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
spark = [
    "pyspark>=3.5",
    "apache-sedona>=1.5",
]
ml = [
    "xgboost>=2.0",
    "lightgbm>=4.2",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "ipykernel>=6.27",
]

[project.scripts]
matcher = "matcher.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/matcher"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
