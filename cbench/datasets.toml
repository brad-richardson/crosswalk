# cbench dataset configuration
# Paths are filenames resolved against data_dir / labels_dir at runtime.

[defaults]
data_dir = "../data/raw"
labels_dir = "../labels/human"
stitch_labels_dir = "../labels/stitching"

# Stitch-level quality gate (enforced only with `cbench run[-batch] --gate`).
#
# Each [gate.<dataset>] block sets a per-dataset floor on the SLIVER-FILTERED
# stitch metrics of the optimizer's group edge selection. The gate AUTO-ARMS:
# a floor is enforced only once >= min_mapped_groups curated stitching labels
# map to current pipeline groups; below that the gate reports skip_unarmed
# (non-blocking), so growing the label base engages the gate with no code
# change. Floors are baseline-minus-margin, mirroring tests/regression/
# test_loo_cv.py. Re-measure and update when the label base or optimizer shifts
# materially (see docs/BENCHMARKING.md "Stitch-level quality gate").
#
# us_boston_streets baseline (2026-07-05, post-#295/#298 set-semantics
# reinterpretation; 123 labels, 3 converted to set semantics -> 111 mapped PAIR
# groups): filtered edge-F1 0.8840, filtered exact-match 0.5946, 0 sliver-
# affected. Floors: F1 0.8840-0.054 -> 0.83; exact 0.5946-0.0946 -> 0.50 (wider
# margin: per-group exact-match is the noisier metric). Set labels are scored
# separately (membership/boundary/coverage) and are NOT gated: only 3 mapped set
# labels exist, far below any sensible arming base — no set floor is invented
# (see docs/BENCHMARKING.md "Stitch-level quality gate").
[gate.us_boston_streets]
min_mapped_groups = 30
f1_filtered_floor = 0.83
exact_filtered_floor = 0.50

[datasets.us_boston_bike_network]
reference = "us_boston_bike_network_overture_segments_v1.0.parquet"
target = "us_boston_bike_network_v1.0.parquet"
connectors = "us_boston_bike_network_overture_connectors_v1.0.parquet"

