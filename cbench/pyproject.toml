[project]
name = "cbench"
version = "0.1.0"
description = "Conflation benchmarking harness - compare road matching tools against ground truth"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Brad Richardson" }]

dependencies = [
    "pandas>=2.0",
    "pyarrow>=17.0",
    "typer>=0.12",
    "rich>=13.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
hootenanny = ["geopandas>=1.0", "shapely>=2.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
cbench = "cbench.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cbench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "E402", "B905", "SIM102", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
